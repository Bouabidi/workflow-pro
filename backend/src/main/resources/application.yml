spring:
  application:
    name: workflow-pro

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workflowpro}
    username: ${DB_USERNAME:workflowapp}
    password: ${DB_PASSWORD:local_dev_password_change_me}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info