services:
  postgres:
    image: postgres:17-alpine
    container_name: workflow-pro-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflowpro}
      POSTGRES_USER: ${POSTGRES_USER:-workflowapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - workflow_pro_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  workflow_pro_postgres_data: